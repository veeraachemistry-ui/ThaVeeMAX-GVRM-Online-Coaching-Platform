
name: ThaVeeMAX Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Project Files
        run: |
          if (!(Test-Path "package.json")) {
            Write-Error "package.json not found. Electron project setup is required."
            exit 1
          }

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Installer
        run: npm run dist

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: ThaVeeMAX-Windows-Installer
          path: |
            release/*.exe
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
